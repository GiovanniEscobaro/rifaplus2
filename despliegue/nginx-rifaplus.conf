# Nginx: recibe las visitas en el puerto 80/443 y se las pasa a RifaPlus (puerto 8001).
# Copiar a /etc/nginx/sites-available/rifaplus, enlazar en sites-enabled y cambiar SU_DOMINIO.
# Certbot agrega solo el HTTPS:  sudo certbot --nginx -d SU_DOMINIO
server {
    listen 80;
    server_name SU_DOMINIO;

    client_max_body_size 6M;  # fotos y comprobantes de hasta 5 MB

    location /estaticos/ {
        alias /opt/rifaplus/app/web/estaticos/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
