[project]
name = "rifaplus"
version = "0.1.0"
description = "RifaPlus: plataforma de rifas de GE Desarrollo e Infraestructura de Software"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["migraciones/versiones"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D1"]  # D1: todo módulo, clase y función debe tener docstring
# B008: Depends()/Form() en los parámetros es el patrón estándar de FastAPI
ignore = ["B008", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"migraciones/versiones/*" = ["E501", "D"]
"migraciones/env.py" = ["D103"]
"tests/*" = ["D"]
